name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -o Sijil_Darajat_AlIjtimaiyat_Amir_Pro.zip -d project
          cd project
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sijil-Darajat-AlIjtimaiyat-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
